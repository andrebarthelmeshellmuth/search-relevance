<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="svf-mock-title svf-mock-desc">
  <title id="svf-mock-title">Illustrative mockup: cross-facet AND correctness for product variants</title>
  <desc id="svf-mock-desc">A search for "Shoes" with Color: Red and Size: 40 both checked. Shoe #1 has a single variant that is Red and 40, so it matches both filters at once. Shoe #2 only has a Green/40 variant and a Red/42 variant -- no single variant is both Red and 40, so it should not match.</desc>

  <defs>
    <symbol id="svf-shoe" viewBox="0 0 24 24">
      <path d="M2 16.5c0-1.4 1.1-2.5 2.5-2.5H8c.9-1.8 2.7-3.6 5.2-4.6 2.8-1.1 5.6-1 6.9.6.9 1.1 1.1 2.6.7 4H21c.6 0 1 .4 1 1v1.2c0 .8-.6 1.4-1.4 1.4H3.4C2.6 17.6 2 17 2 16.2z"/>
      <path d="M2 16.8h20" stroke="rgba(0,0,0,.18)" stroke-width="1"/>
    </symbol>
    <symbol id="svf-check" viewBox="0 0 16 16">
      <path d="M3 8.5 6.2 12 13 4" fill="none" stroke="#fffefa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1920" height="1080" fill="#f5f3ef"/>

  <text x="100" y="66" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#5a6a72">ILLUSTRATIVE MOCKUP · REAL SCREENSHOTS COMING SOON</text>

  <!-- Search bar -->
  <rect x="100" y="106" width="1720" height="78" rx="14" fill="#fffefa" stroke="#d9ddd9" stroke-width="2"/>
  <circle cx="152" cy="145" r="11" fill="none" stroke="#5a6a72" stroke-width="2.4"/>
  <line x1="160" y1="153" x2="170" y2="163" stroke="#5a6a72" stroke-width="2.4" stroke-linecap="round"/>
  <text x="190" y="155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#122a35">Shoes</text>
  <rect x="1740" y="122" width="60" height="46" rx="10" fill="#006e71"/>
  <circle cx="1762" cy="145" r="8" fill="none" stroke="#fffefa" stroke-width="2.2"/>
  <line x1="1768" y1="151" x2="1776" y2="159" stroke="#fffefa" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Facet: Color -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="100" y="228" width="560" height="248" rx="14" fill="#fffefa" stroke="#d9ddd9" stroke-width="2"/>
    <text x="132" y="272" font-size="24" font-weight="700" fill="#122a35">Color</text>
    <path d="M600 264 610 264 605 272 Z" fill="#5a6a72"/>
    <line x1="132" y1="290" x2="628" y2="290" stroke="#d9ddd9" stroke-width="1.5"/>

    <!-- Red: checked -->
    <rect x="132" y="316" width="30" height="30" rx="7" fill="#006e71"/>
    <use href="#svf-check" x="139" y="323" width="16" height="16"/>
    <circle cx="196" cy="331" r="10" fill="#c0392b"/>
    <text x="216" y="339" font-size="22" fill="#122a35">Red</text>
    <text x="590" y="339" font-size="18" fill="#5a6a72" text-anchor="end">(12)</text>

    <!-- Green: unchecked -->
    <rect x="132" y="374" width="30" height="30" rx="7" fill="none" stroke="#a9b3ae" stroke-width="2.2"/>
    <circle cx="196" cy="389" r="10" fill="#3f8f5f"/>
    <text x="216" y="397" font-size="22" fill="#122a35">Green</text>
    <text x="590" y="397" font-size="18" fill="#5a6a72" text-anchor="end">(8)</text>
  </g>

  <!-- Facet: Size -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="700" y="228" width="560" height="248" rx="14" fill="#fffefa" stroke="#d9ddd9" stroke-width="2"/>
    <text x="732" y="272" font-size="24" font-weight="700" fill="#122a35">Size</text>
    <path d="M1200 264 1210 264 1205 272 Z" fill="#5a6a72"/>
    <line x1="732" y1="290" x2="1228" y2="290" stroke="#d9ddd9" stroke-width="1.5"/>

    <!-- 40: checked -->
    <rect x="732" y="316" width="30" height="30" rx="7" fill="#006e71"/>
    <use href="#svf-check" x="739" y="323" width="16" height="16"/>
    <text x="786" y="339" font-size="22" fill="#122a35">40</text>
    <text x="1190" y="339" font-size="18" fill="#5a6a72" text-anchor="end">(19)</text>

    <!-- 42: unchecked -->
    <rect x="732" y="374" width="30" height="30" rx="7" fill="none" stroke="#a9b3ae" stroke-width="2.2"/>
    <text x="786" y="397" font-size="22" fill="#122a35">42</text>
    <text x="1190" y="397" font-size="18" fill="#5a6a72" text-anchor="end">(14)</text>
  </g>

  <!-- Result cards -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <!-- Shoe #1: single variant satisfies both filters -->
    <rect x="100" y="560" width="840" height="460" rx="18" fill="#fffefa" stroke="rgba(0,110,113,.5)" stroke-width="2.5"/>
    <text x="140" y="614" font-size="30" font-weight="700" fill="#122a35">Shoe #1</text>
    <text x="140" y="644" font-size="18" fill="#5a6a72">Abstract product</text>
    <rect x="712" y="588" width="204" height="42" rx="21" fill="#dff0ed"/>
    <path d="M736 609 743 617 757 597" fill="none" stroke="#006e71" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="772" y="615" font-size="16" font-weight="700" fill="#006e71" text-anchor="start">Matches both</text>

    <rect x="300" y="668" width="240" height="168" rx="16" fill="#eef2f1"/>
    <use href="#svf-shoe" x="360" y="716" width="120" height="120" fill="#122a35"/>

    <text x="140" y="892" font-size="18" font-weight="700" fill="#5a6a72" letter-spacing="1">VARIANTS</text>
    <line x1="140" y1="908" x2="800" y2="908" stroke="#d9ddd9" stroke-width="1.5"/>
    <rect x="140" y="932" width="220" height="64" rx="14" fill="#f5f3ef" stroke="rgba(0,110,113,.45)" stroke-width="2"/>
    <circle cx="176" cy="964" r="12" fill="#c0392b"/>
    <text x="200" y="960" font-size="19" font-weight="600" fill="#122a35">Red</text>
    <text x="200" y="984" font-size="17" fill="#5a6a72">Size 40</text>

    <!-- Shoe #2: attribute values split across two variants -->
    <rect x="980" y="560" width="840" height="460" rx="18" fill="#fffefa" stroke="rgba(210,146,35,.5)" stroke-width="2.5"/>
    <text x="1020" y="614" font-size="30" font-weight="700" fill="#122a35">Shoe #2</text>
    <text x="1020" y="644" font-size="18" fill="#5a6a72">Abstract product</text>
    <rect x="1496" y="588" width="324" height="42" rx="21" fill="#faf1e2"/>
    <path d="M1520 601 1532 615 M1532 601 1520 615" stroke="#b5762a" stroke-width="2.6" stroke-linecap="round"/>
    <text x="1548" y="615" font-size="16" font-weight="700" fill="#b5762a" text-anchor="start">No variant matches both</text>

    <rect x="1180" y="668" width="240" height="168" rx="16" fill="#eef2f1"/>
    <use href="#svf-shoe" x="1240" y="716" width="120" height="120" fill="#122a35"/>

    <text x="1020" y="892" font-size="18" font-weight="700" fill="#5a6a72" letter-spacing="1">VARIANTS</text>
    <line x1="1020" y1="908" x2="1800" y2="908" stroke="#d9ddd9" stroke-width="1.5"/>

    <rect x="1020" y="932" width="220" height="64" rx="14" fill="#f5f3ef" stroke="#d9ddd9" stroke-width="2"/>
    <circle cx="1056" cy="964" r="12" fill="#3f8f5f"/>
    <text x="1080" y="960" font-size="19" font-weight="600" fill="#122a35">Green</text>
    <text x="1080" y="984" font-size="17" fill="#5a6a72">Size 40</text>

    <rect x="1264" y="932" width="220" height="64" rx="14" fill="#f5f3ef" stroke="#d9ddd9" stroke-width="2"/>
    <circle cx="1300" cy="964" r="12" fill="#c0392b"/>
    <text x="1324" y="960" font-size="19" font-weight="600" fill="#122a35">Red</text>
    <text x="1324" y="984" font-size="17" fill="#5a6a72">Size 42</text>
  </g>
</svg>
