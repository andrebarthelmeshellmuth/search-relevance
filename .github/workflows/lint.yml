name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # html-validate 11.x uses fs.globSync internally, added in Node 22 -- Node 20 fails at
          # runtime with "fs.globSync is not a function", not a version-mismatch error, so this isn't
          # obvious from the failure alone.
          node-version: 22
          cache: npm
      # sharp is an optionalDependency because it's only needed by `npm run images`, which is a manual
      # step run when screenshots change -- not part of CI. Skipping it keeps this job from pulling
      # ~30 MB of platform binaries just to lint two HTML files.
      - run: npm ci --omit=optional
      - run: npm run build
      - run: npm run lint:html
